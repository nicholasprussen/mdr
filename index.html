    <template id="box">
        <link rel="stylesheet" type="text/css" href="assets/css/shadow-box.scss">
        <div class="box">
            <!-- <div class="shadow-top"> -->
                
            <!-- </div> -->
             <div class="box-inner">
                <div class="shadow-side shadow-top-left"></div>
                <div class="shadow-side shadow-top-right"></div>
                <div class="shadow-middle"></div>
                <div class="box-top">
                
                    <slot name="box-num"></slot>
                </div>
                <div class="box-bottom" style="position: relative">
                    <div class="box-progress-bar" style="width: 0%">
                        
                    </div>
                    <div class="box-percentage">
                        <span class="box-percentage-text percent-num">0</span>
                        <span class="box-percentage-text">%</span>
                    </div>
                </div>
             </div>
        </div>
    </template>


    <script>
        const template = document.getElementById('box');
        console.log(template)
        class BoxElement extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: "open" });
                this.shadowRoot.appendChild(template.content.cloneNode(true));
            }
        }
        customElements.define('boxy-box', BoxElement);
    </script>

    <object style="display: none;" id="svgObject" type="image/svg+xml" data="assets/img/lumon-logo.svg"></object>

    <body class="body" id="body">
