<html>
    <head>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .padding {
                height: 300px;
            }
            .bin {
                height: 200px;
                width: 300px;
                /* background-color: gray; */
                position: relative;
                display: flex;
                /* perspective-origin: center;
                transform-style: preserve-3d;
                perspective: 1000px; */
            }

            .bin-lid-left {
                position: absolute;
                display: block;
                width: 50%;
                height: 25px;
                top: -25px;
                border: 5px solid blue;
                border-style: inset;
                backface-visibility: visible;
                /* background-color: black; */
                transform-origin: bottom left;
                transform: rotateZ(-140deg) rotateX(180deg) skewX(-40deg);
                background-color: white;
                z-index: 5;
                /* transform: rotateY(-100deg) translateY(-1px) scaleX(1.5); */
                /* transition: all 1s ease-in-out; */
            }

            .bin-lid-left[closed="true"] {
                animation: lid-left 1s ease-in-out forwards;
                /* transform: rotateZ(0deg) rotateX(0deg) skewX(0deg); */
                /* height: 0px; */
                /* top: -5px; */
                /* top: 1px;
                border-width: 2.5px; */
            }

            @keyframes lid-left {
                0% {
                    transform: rotateZ(-140deg) rotateX(180deg) skewX(-40deg);
                }
                100% {
                    transform: rotateZ(0deg) rotateX(100deg) skewX(0deg);
                }
            }

            .bin-lid-right {
                position: absolute;
                display: block;
                width: 50%;
                height: 25px;
                top: -25px;
                right: 0;
                border: 5px solid blue;
                border-style: inset;
                backface-visibility: visible;
                /* background-color: black; */
                transform-origin: bottom right;
                background-color: white;
                z-index: 5;
                transform: rotateZ(140deg) rotateX(180deg) skewX(40deg);
                /* transform: rotateY(-100deg) translateY(-1px) scaleX(1.5); */
                /* transition: all 1s ease-in-out; */
            }

            .bin-lid-right[closed="true"] {
                animation: lid-right 1s ease-in-out forwards;
                /* transform: rotateY(0deg) translateY(-1px) scaleX(1);
                height: 0px;
                top: 1px;
                border-width: 2.5px; */
            }

            @keyframes lid-right {
                0% {
                    transform: rotateZ(140deg) rotateX(180deg) skewX(40deg);
                }
                100% {
                    transform: rotateZ(0deg) rotateX(100deg) skewX(0deg);
                }
            }

            .bin-center {
                position: absolute;
                display: block;
                width: 100%;
                top: -33px;
                left: 0;
                height: 33px;
                background-color: black;
                border-right: 5px solid blue;
                border-left: 5px solid blue;
                z-index: -1;
            }

            .bin-center::after {
                content: '';
                position: absolute;
                width: calc(100% + 2px);
                height: 5px;
                background-color: blue;
                top: 0;
                left: -1px;
                z-index: 1;
            }

            .bin-center[closed="true"] {
                animation: center-close 0.6s ease-in-out forwards;
            }

            @keyframes center-close {
                0% {

                }
                100% {
                    top: 0;
                }
            }

            .bin-bottom {
                width: 100%;
                height: 100%;
                border: 5px solid blue;
                flex-grow: 1;
                background-color: white;
                z-index: 50;
            }
        </style>
    </head>
    <body>
        <div class="padding">

        </div>
        <div class="bin" id="bin">
            <div class="bin-lid-left" id="left">

            </div>
            <div class="bin-lid-right" id="right">

            </div>
            <div class="bin-center" id="center"></div>
            <div class="bin-bottom">

            </div>
        </div>
    </body>

    <script>
            let bin = document.getElementById('bin');
            let binLeft = document.getElementById('left');
            let binRight = document.getElementById('right');
            let binCenter = document.getElementById('center');
            let closed = false;
            bin.addEventListener('click', () => {
                binLeft.setAttribute('closed', (!closed).toString());
                binRight.setAttribute('closed', (!closed).toString());
                binCenter.setAttribute('closed', (!closed).toString());
                closed = !closed
            })
    </script>
</html>
